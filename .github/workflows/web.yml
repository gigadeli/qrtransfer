name: web

# スマホ用の受信ページ（web/）のテストとビルド。main に push されたら GitHub Pages に公開する。
# Python 版の送信処理が変わったときも、Web 版で受信できるかを確かめるために実行する。
on:
  push:
    branches: ["**"]
    paths:
      - "web/**"
      - "src/qrtransfer/protocol.py"
      - "src/qrtransfer/packer.py"
      - "src/qrtransfer/qrgen.py"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "web/**"
      - "src/qrtransfer/protocol.py"
      - "src/qrtransfer/packer.py"
      - "src/qrtransfer/qrgen.py"
      - ".github/workflows/web.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Make fixtures with the Python sender
        run: |
          pip install segno numpy pillow opencv-python-headless
          python scripts/make_fixtures.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Build
        env:
          QRT_BASE: /${{ github.event.repository.name }}/
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: web/dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
