name: build

# ブランチへの push / PR ではビルドとテストだけを行う。
# v で始まるタグ（例: v1.0.0）を push すると、ビルドした exe を GitHub Releases に公開する。
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # Releases の作成に必要

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Check version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".Substring(1)
          $ver = (Select-String -Path src\qrtransfer\__init__.py -Pattern '__version__\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          if ($tag -ne $ver) { Write-Error "タグ v$tag と __version__ ($ver) が一致しません"; exit 1 }
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q
      - name: Build exe
        run: pyinstaller --noconfirm QRTransfer.spec
      - name: Self-test exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\QRTransfer.exe -ArgumentList "--selftest","--quiet" -Wait -PassThru
          Get-Content "$env:LOCALAPPDATA\QRTransfer\selftest.log"
          if ($p.ExitCode -ne 0) { exit 1 }
      - name: Checksum
        shell: pwsh
        run: |
          $h = (Get-FileHash dist\QRTransfer.exe -Algorithm SHA256).Hash.ToLower()
          "$h  QRTransfer.exe" | Out-File -Encoding ascii dist\QRTransfer.exe.sha256
          Get-Content dist\QRTransfer.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: QRTransfer
          path: |
            dist/QRTransfer.exe
            dist/QRTransfer.exe.sha256
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: QRTransfer ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/QRTransfer.exe
            dist/QRTransfer.exe.sha256
